name: Live feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [posts.json, state.json, "media/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll Telegram
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
        run: python scripts/poll_telegram.py

      - name: Commit new posts
        run: |
          git config user.name "live-feed-bot"
          git config user.email "live-feed-bot@users.noreply.github.com"
          git add -A -- posts.json state.json
          if [ -d media ]; then git add -A -- media; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Live feed update $(date -u
